name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/,package.json,package-lock.json,ecosystem.config.js"
          target: "~/fitzelly-backend"
          strip_components: 0

      - name: Deploy on EC2 with PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fitzelly-backend
            
            # Install only production dependencies
            npm ci --omit=dev
            
            # Reload (zero-downtime) or start if first deploy
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            
            # Save process list so it restarts on server reboot
            pm2 save
