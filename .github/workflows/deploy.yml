name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/,package.json,package-lock.json"
          target: "~/fitzelly-backend"
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Start Redis if not running
            if ! docker ps --format '{{.Names}}' | grep -q '^redis$'; then
              docker start redis 2>/dev/null || docker run -d --name redis -p 6379:6379 redis:7-alpine
            fi

            cd ~/fitzelly-backend
            npm ci --omit=dev

            pm2 reload backend || pm2 start dist/main.js --name backend
            pm2 reload cron   || pm2 start dist/cron.js --name cron
            pm2 reload worker || pm2 start dist/worker.js --name worker

            pm2 save
