services:

  # In-memory store/queue service
  redis:
    image: redis:alpine
    container_name: fitzelly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Backend API service
  api:
    build: .
    container_name: fitzelly-api
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env

  # Backend Cron Job service
  cron:
    build: .
    container_name: fitzelly-cron
    restart: unless-stopped
    depends_on:
      - redis
    command: ["npm", "run", "cron:start"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env

  # Backend Worker service (BullMQ)
  worker:
    build: .
    container_name: fitzelly-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["npm", "run", "worker:start"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env

volumes:
  fitzelly-db-data:
